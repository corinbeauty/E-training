<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不老松中清店 - 勞工教育訓練系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
        .brand-bg { background-color: #1a4d2e; }
        .brand-text { color: #1a4d2e; }
        .section-card { @apply bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden mb-8 transition-all; }
        
        /* 流程圖樣式 */
        .flow-step { @apply flex flex-col items-center text-center p-3 bg-gray-50 rounded-xl border border-gray-200 text-[10px] font-bold; }
        .flow-arrow { @apply hidden md:flex items-center justify-center text-gray-300; }

        /* 全螢幕簽名層 */
        #sig-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 9999;
            flex-direction: column;
        }
        
        /* 橫向強制旋轉邏輯 */
        @media screen and (orientation: portrait) {
            #sig-canvas-container {
                transform: rotate(90deg);
                transform-origin: center;
                width: 100vh;
                height: 100vw;
            }
        }
        
        #sig-canvas {
            touch-action: none;
            cursor: crosshair;
            background: #fafafa;
        }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <script>
        const imagePaths = {
            logo: "logo.png", 
            safetySop: "安全作業標準.jpg",
            harassment: "性騷防治.jpg",
            hocl: "次氯酸水.jpg",
            alcohol: "酒精.jpg"
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBfS9CJMmhQfFkNB3mwco5apc9rDpp3ipw",
            authDomain: "e-training-a6d4c.firebaseapp.com",
            projectId: "e-training-a6d4c",
            storageBucket: "e-training-a6d4c.firebasestorage.app",
            messagingSenderId: "96150516095",
            appId: "1:96150516095:web:750f1f466560642ec92a4a",
            measurementId: "G-VB3WWZ8PYL"
        };
    </script>

    <!-- 頂部標題 -->
    <header class="brand-bg text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="bg-white p-1 rounded-full w-12 h-12 flex items-center justify-center shadow-inner">
                    <img id="img-logo" src="" alt="Logo" class="w-10 h-10 object-contain">
                </div>
                <h1 class="text-xl font-bold tracking-tight">不老松中清店</h1>
            </div>
            <div class="bg-black/20 px-3 py-1 rounded-xl text-center">
                <div id="completeCount" class="text-xl font-bold leading-none">0</div>
                <div class="text-[8px] opacity-70 uppercase mt-1">已完成人數</div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- 模組一 -->
        <section class="section-card">
            <div class="bg-red-700 text-white px-6 py-4 flex items-center">
                <i class="fas fa-fire-alt mr-3"></i>
                <h2 class="font-bold">模組一：煮茶安全作業標準 (SOP)</h2>
            </div>
            <div class="p-6">
                <img id="img-safetySop" src="" alt="SOP 教材" class="w-full rounded-2xl mb-6 border">
                <div class="grid grid-cols-1 md:grid-cols-9 gap-2 items-center">
                    <div class="flow-step md:col-span-1">1. 檢查設備</div>
                    <div class="flow-arrow md:col-span-1"><i class="fas fa-chevron-right"></i></div>
                    <div class="flow-step md:col-span-1">2. 加水開火</div>
                    <div class="flow-arrow md:col-span-1"><i class="fas fa-chevron-right"></i></div>
                    <div class="flow-step md:col-span-1 border-blue-500 bg-blue-50">3. 全程監控</div>
                    <div class="flow-arrow md:col-span-1"><i class="fas fa-chevron-right"></i></div>
                    <div class="flow-step md:col-span-1">4. 沸騰熄火</div>
                    <div class="flow-arrow md:col-span-1"><i class="fas fa-chevron-right"></i></div>
                    <div class="flow-step md:col-span-1">5. 清潔復原</div>
                </div>
            </div>
        </section>

        <!-- 模組二 -->
        <section class="section-card">
            <div class="brand-bg text-white px-6 py-4 flex items-center">
                <i class="fas fa-users-slash mr-3"></i>
                <h2 class="font-bold">模組二：職場性騷擾防治</h2>
            </div>
            <div class="p-6">
                <img id="img-harassment" src="" alt="性騷擾防治" class="w-full rounded-2xl border">
            </div>
        </section>

        <!-- 模組三 -->
        <section class="section-card">
            <div class="bg-blue-600 text-white px-6 py-4 flex items-center">
                <i class="fas fa-hand-holding-droplet mr-3"></i>
                <h2 class="font-bold">模組三：消毒用品安全規範</h2>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <img id="img-hocl" src="" class="rounded-xl border shadow-sm w-full">
                <img id="img-alcohol" src="" class="rounded-xl border shadow-sm w-full">
            </div>
        </section>

        <!-- 簽名按鈕 -->
        <section class="mt-12 mb-20 text-center">
            <div class="max-w-md mx-auto space-y-6">
                <div class="text-left">
                    <label class="block text-sm font-bold text-gray-600 mb-2 ml-2">員工姓名</label>
                    <input type="text" id="userName" placeholder="請輸入全名" 
                           class="w-full px-6 py-4 rounded-2xl border-2 border-gray-200 focus:border-[#1a4d2e] outline-none text-lg">
                </div>
                
                <div id="signature-preview-box" class="hidden w-full h-32 bg-white rounded-2xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden">
                    <img id="sig-preview-img" class="h-full object-contain">
                </div>

                <button onclick="openSignature()" class="w-full brand-bg text-white font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center text-xl">
                    <i class="fas fa-pen-fancy mr-3"></i> 點擊進行電子簽名
                </button>
                
                <button onclick="finalSubmit()" id="submitBtn" class="w-full bg-gray-400 text-white font-bold py-5 rounded-2xl shadow-md transition-all hidden">
                    確認上傳訓練紀錄
                </button>
            </div>
        </section>

        <!-- 紀錄名單 -->
        <section>
            <h3 class="text-lg font-bold brand-text mb-4 flex items-center">
                <i class="fas fa-list-check mr-2"></i> 簽署紀錄名單
            </h3>
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="px-6 py-4 font-bold text-gray-500">姓名</th>
                                <th class="px-6 py-4 font-bold text-gray-500">簽名</th>
                                <th class="px-6 py-4 font-bold text-gray-500">紀錄時間</th>
                            </tr>
                        </thead>
                        <tbody id="signatureList" class="divide-y divide-gray-50">
                            <tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">正在載入數據...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- 簽名 Overlay -->
    <div id="sig-overlay">
        <!-- 功能按鈕區 -->
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-[10001] pointer-events-none">
            <div class="bg-black/50 text-white text-[10px] px-3 py-1 rounded-full pointer-events-auto">
                <i class="fas fa-mobile-alt mr-1"></i> 請橫向書寫
            </div>
            <div class="flex space-x-3 pointer-events-auto">
                <button onclick="clearCanvas()" class="bg-red-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg">
                    <i class="fas fa-trash-can mr-1"></i> 清除
                </button>
                <button onclick="finishSignature()" class="bg-green-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg">
                    <i class="fas fa-check mr-1"></i> 完成
                </button>
            </div>
        </div>
        <!-- 畫布容器 -->
        <div id="sig-canvas-container" class="flex-1 flex items-center justify-center overflow-hidden bg-gray-50">
            <canvas id="sig-canvas"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.getElementById('img-logo').src = imagePaths.logo;
        document.getElementById('img-safetySop').src = imagePaths.safetySop;
        document.getElementById('img-harassment').src = imagePaths.harassment;
        document.getElementById('img-hocl').src = imagePaths.hocl;
        document.getElementById('img-alcohol').src = imagePaths.alcohol;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "bulasong-training-v3";

        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('sig-overlay');
        let isDrawing = false;
        let lastSigData = null;

        // 開啟簽名介面
        window.openSignature = () => {
            const name = document.getElementById('userName').value.trim();
            if(!name) return alert("請先輸入姓名");
            
            overlay.style.display = 'flex';
            resizeCanvas();
        };

        function resizeCanvas() {
            const container = document.getElementById('sig-canvas-container');
            // 由於 CSS 旋轉，我們需要計算實際的物理尺寸
            const isPortrait = window.innerHeight > window.innerWidth;
            if (isPortrait) {
                canvas.width = window.innerHeight;
                canvas.height = window.innerWidth;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
        }

        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const isPortrait = window.innerHeight > window.innerWidth;
            
            if (isPortrait) {
                // 處理 CSS 旋轉後的座標映射
                const x = clientY - rect.top;
                const y = rect.right - clientX;
                return { x, y };
            } else {
                return { x: clientX - rect.left, y: clientY - rect.top };
            }
        };

        const start = (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if(e.type === 'touchstart') e.preventDefault();
        };

        const draw = (e) => {
            if(!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            if(e.type === 'touchmove') e.preventDefault();
        };

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);

        window.clearCanvas = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        window.finishSignature = () => {
            lastSigData = canvas.toDataURL();
            overlay.style.display = 'none';
            document.getElementById('sig-preview-img').src = lastSigData;
            document.getElementById('signature-preview-box').classList.remove('hidden');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.remove('hidden');
            submitBtn.classList.replace('bg-gray-400', 'brand-bg');
        };

        window.finalSubmit = async () => {
            const name = document.getElementById('userName').value.trim();
            if(!name || !lastSigData) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>上傳中...';

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'signatures'), {
                    name, signature: lastSigData, timestamp: serverTimestamp()
                });
                alert("培訓紀錄簽署成功！");
                location.reload();
            } catch (e) {
                alert("上傳失敗：" + e.message);
                btn.disabled = false;
                btn.innerText = '確認上傳訓練紀錄';
            }
        };

        const sync = async () => {
            await signInAnonymously(auth);
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'signatures'), (snap) => {
                const list = document.getElementById('signatureList');
                const count = document.getElementById('completeCount');
                const docs = snap.docs.map(d => d.data());
                docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                count.innerText = docs.length;

                if (docs.length === 0) {
                    list.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">尚無簽署紀錄</td></tr>';
                    return;
                }
                list.innerHTML = docs.map(d => `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-bold text-gray-700">${d.name}</td>
                        <td class="px-6 py-4"><img src="${d.signature}" class="h-8 object-contain"></td>
                        <td class="px-6 py-4 text-[10px] text-gray-400">${d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString() : '處理中'}</td>
                    </tr>
                `).join('');
            });
        };
        sync();
    </script>
</body>
</html>
